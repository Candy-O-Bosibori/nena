name: Test

# Merge gate, not a deploy mechanism -- Railway auto-deploys nena-backend and
# nena-frontend on push to main independently of this workflow. This just
# stops broken code from getting there in the first place.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nena_user
          POSTGRES_PASSWORD: nena_password
          POSTGRES_DB: nena
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Nena_Back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://nena_user:nena_password@localhost:5432/nena?options=-csearch_path=test
        run: python3 -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Nena-Front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: Nena-Front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
